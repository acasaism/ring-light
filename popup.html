<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 14px system-ui, sans-serif; width: 240px; margin: 12px; }
    label { display: block; margin: 12px 0 4px; }
    input[type=range] { width: 100%; }
    .row { display: flex; justify-content: space-between; font-size: 12px; color: #666; }
    .switch-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; cursor: pointer; }
    /* Knob drawn with a gradient: Firefox does not render ::before on inputs. */
    input[role=switch] {
      appearance: none; flex: none; width: 36px; height: 20px; margin: 0; border-radius: 10px; cursor: pointer;
      background: radial-gradient(circle at 10px 50%, #fff 7px, transparent 7.5px) #9aa0a6;
      transition: background-color 0.15s;
    }
    input[role=switch]:checked { background: radial-gradient(circle at 26px 50%, #fff 7px, transparent 7.5px) #0b57d0; }
    input[role=switch]:focus-visible { outline: 2px solid #0b57d0; outline-offset: 2px; }
    #preview { height: 24px; border: 1px solid #ccc; border-radius: 4px; margin-top: 12px; }
    #reset, #lightWindow { margin-top: 12px; width: 100%; }
    #reset { margin-top: 6px; }
    .hint { margin-top: 4px; font-size: 12px; color: #666; }
    .center { text-align: center; margin-top: 8px; }
  </style>
</head>
<body>
  <label class="switch-row"><span data-i18n="on"></span><input type="checkbox" role="switch" id="on"></label>

  <label class="switch-row"><span data-i18n="frame"></span><input type="checkbox" role="switch" id="frame"></label>
  <div id="frameOptions">
    <label for="size" data-i18n="size"></label>
    <input type="range" id="size" min="5" max="35" step="1">
    <div class="row"><span data-i18n="thin"></span><span data-i18n="thick"></span></div>

  </div>

  <label for="warmth" data-i18n="temperature"></label>
  <input type="range" id="warmth" min="-100" max="100" step="5">
  <div class="row"><span data-i18n="cool"></span><span data-i18n="warm"></span></div>

  <label for="intensity" data-i18n="intensity"></label>
  <input type="range" id="intensity" min="30" max="100" step="5">
  <div class="row"><span data-i18n="dim"></span><span data-i18n="max"></span></div>

  <label class="switch-row"><span data-i18n="meetBg"></span><input type="checkbox" role="switch" id="meetBg"></label>
  <div class="hint" data-i18n="meetBgHint"></div>

  <div id="preview"></div>
  <button id="lightWindow" data-i18n="openLightWindow"></button>
  <button id="reset" data-i18n="reset"></button>
  <div class="hint center" data-i18n="shortcutHint"></div>

  <script src="light.js"></script>
  <script src="popup.js"></script>
</body>
</html>
